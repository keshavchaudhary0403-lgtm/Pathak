</head>

<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="shell-top" id="shell-top">
  <div class="bar glass">
    <a class="brand" href="/" title="Pathak home"><span class="logo">प</span>Pathak</a>
    <nav class="tabs" aria-label="Sections">
      <a class="tab" href="#/library" data-tab="library"><svg class="i"><use href="#i-book"/></svg>Library</a>
      <a class="tab" href="#/cards" data-tab="cards"><svg class="i"><use href="#i-cards"/></svg>Cards</a>
    </nav>
    <div class="actions">
      <button class="ib" type="button" id="themeBtn" aria-label="Switch theme"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="ib" type="button" id="settingsBtn" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
      <button class="btn grad" type="button" data-add><svg class="i"><use href="#i-plus"/></svg><span class="add-label">Add book</span></button>
    </div>
  </div>
</header>

<main class="view" id="view"></main>

<nav class="tabbar glass" aria-label="Sections">
  <a class="tab" href="#/library" data-tab="library"><svg class="i"><use href="#i-book"/></svg>Library</a>
  <a class="tab" href="#/cards" data-tab="cards"><svg class="i"><use href="#i-cards"/></svg>Cards</a>
</nav>

<section id="reader" hidden aria-label="Reader">
  <div class="r-top">
    <button class="ib sq back" type="button" data-r="close" aria-label="Back to library"><svg class="i"><use href="#i-back"/></svg><span>Library</span></button>
    <div class="r-title"><b id="rTitle"></b><span id="rChapter"></span></div>
    <button class="ib sq" type="button" data-r="search" aria-label="Search this book" title="Search"><svg class="i"><use href="#i-search"/></svg></button>
    <button class="ib sq" type="button" data-r="listen" aria-label="Read aloud" title="Read aloud"><svg class="i"><use href="#i-headphones"/></svg></button>
    <button class="ib sq" type="button" data-r="toc" aria-label="Contents and highlights"><svg class="i"><use href="#i-list"/></svg></button>
    <button class="ib sq aa" type="button" data-r="settings" aria-label="Reading settings">Aa</button>
  </div>
  <div class="r-stage">
    <div class="r-host" id="rHost"></div>
    <div class="r-loading" id="rLoading"><div><div class="spinner"></div>Opening book…</div></div>
    <button class="navbtn l" type="button" data-r="prev" aria-label="Previous page"><svg class="i"><use href="#i-back"/></svg></button>
    <button class="navbtn r" type="button" data-r="next" aria-label="Next page"><svg class="i"><use href="#i-next"/></svg></button>
  </div>
  <div class="tts" id="tts" hidden role="group" aria-label="Read aloud">
    <button type="button" data-tts="prev" aria-label="Previous sentence"><svg class="i"><use href="#i-back"/></svg></button>
    <button type="button" class="main" data-tts="toggle" aria-label="Pause"><svg class="i"><use href="#i-pause"/></svg></button>
    <button type="button" data-tts="next" aria-label="Next sentence"><svg class="i"><use href="#i-next"/></svg></button>
    <button type="button" class="rate" data-tts="rate" aria-label="Reading speed">1×</button>
    <button type="button" data-tts="stop" aria-label="Stop reading"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="r-bot">
    <input class="range" id="rRange" type="range" min="0" max="1000" value="0" aria-label="Position in book">
    <div class="r-row"><span id="rLeft"></span><span class="mid" id="rMid"></span><span id="rPct">0%</span></div>
    <div class="r-actions">
      <div class="r-sw" role="group" aria-label="Page colour">
        <button type="button" data-rt="paper" aria-label="Paper page"></button>
        <button type="button" data-rt="sepia" aria-label="Sepia page"></button>
        <button type="button" data-rt="gray" aria-label="Dusk page"></button>
        <button type="button" data-rt="night" aria-label="Night page"></button>
      </div>
      <button class="r-save" type="button" data-r="save"><svg class="i"><use href="#i-plus"/></svg>Save card</button>
    </div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filePick" accept=".epub,.pdf,application/epub+zip,application/pdf" multiple hidden>
</body>
</html>
